name: uleam_embarcaciones
description: Sistema de Control de Embarcaciones — FCVT ULEAM
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP y almacenamiento
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0

  # Navegación
  go_router: ^13.2.0

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.68.0

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # PDF
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.3
  open_filex: ^4.3.4

  # Utilidades
  intl: ^0.19.0
  table_calendar: ^3.1.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  flutter_native_splash: ^2.4.0
  image_cropper: 7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo_nuevo.png

  android_12:
    color: "#FFFFFF"
    image: assets/images/logo_nuevo.png

  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_nuevo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_nuevo.png"