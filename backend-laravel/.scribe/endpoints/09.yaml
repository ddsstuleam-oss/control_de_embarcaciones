name: 'Admin — Reportes'
description: |-

  Endpoints para generación y descarga de reportes en Excel y PDF.
  Todos los endpoints requieren rol admin.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: api/admin/reportes/excel-pasajeros
    metadata:
      custom: []
      groupName: 'Admin — Reportes'
      groupDescription: |-

        Endpoints para generación y descarga de reportes en Excel y PDF.
        Todos los endpoints requieren rol admin.
      subgroup: ''
      subgroupDescription: ''
      title: 'Excel — pasajeros por fecha'
      description: |-
        Genera y descarga un archivo Excel con el listado completo de pasajeros
        de todas las reservas activas para una fecha específica.
        Incluye: N° reserva, embarcación, titular, nombre pasajero, cédula, tipo, carrera, teléfono, email, estado.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {TU_TOKEN_AQUI}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters:
      fecha:
        custom: []
        name: fecha
        description: 'Fecha de embarque (YYYY-MM-DD).'
        required: true
        example: '2026-05-10'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      embarcacion_id:
        custom: []
        name: embarcacion_id
        description: 'Filtrar por embarcación específica.'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanQueryParameters:
      fecha: '2026-05-10'
      embarcacion_id: 1
    bodyParameters:
      fecha:
        custom: []
        name: fecha
        description: validation.date.
        required: true
        example: '2026-04-14T23:32:05'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      embarcacion_id:
        custom: []
        name: embarcacion_id
        description: 'The <code>id</code> of an existing record in the embarcaciones table.'
        required: false
        example: null
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
    cleanBodyParameters:
      fecha: '2026-04-14T23:32:05'
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '<<binary>> Archivo Excel (.xlsx) con listado de pasajeros.'
        headers: []
        description: Éxito
      -
        custom: []
        status: 422
        content: |-
          {
            "message": "Error de validación",
            "errors": {"fecha": ["The fecha field is required."]}
          }
        headers: []
        description: Validación
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 3V5EgbkvZcDPa166h8fd4ae'
    controller: null
    method: null
    route: null
