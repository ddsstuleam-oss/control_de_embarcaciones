name: Actividad
description: |-

  Endpoints para registro de actividad del usuario autenticado.
  Flutter debe llamar a este endpoint para registrar acciones importantes
  como login, creación de reservas, descarga de boletos, etc.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/actividad
    metadata:
      custom: []
      groupName: Actividad
      groupDescription: |-

        Endpoints para registro de actividad del usuario autenticado.
        Flutter debe llamar a este endpoint para registrar acciones importantes
        como login, creación de reservas, descarga de boletos, etc.
      subgroup: ''
      subgroupDescription: ''
      title: 'Registrar actividad'
      description: |-
        Registra una acción del usuario autenticado para auditoría institucional.
        La IP se captura automáticamente del servidor.
        Recomendado llamar desde Flutter en: login, reserva creada, boleto descargado, logout.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {TU_TOKEN_AQUI}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      accion:
        custom: []
        name: accion
        description: 'Nombre de la acción realizada (max 100 caracteres).'
        required: true
        example: login
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      descripcion:
        custom: []
        name: descripcion
        description: 'Descripción detallada de la acción (max 500 caracteres).'
        required: false
        example: 'Inicio de sesión exitoso desde app móvil'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      dispositivo:
        custom: []
        name: dispositivo
        description: 'Nombre o descripción del dispositivo (max 255 caracteres).'
        required: false
        example: 'Samsung Galaxy S23 Android 14'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
    cleanBodyParameters:
      accion: login
      descripcion: 'Inicio de sesión exitoso desde app móvil'
      dispositivo: 'Samsung Galaxy S23 Android 14'
    fileParameters: []
    responses:
      -
        custom: []
        status: 201
        content: |-
          {
            "message": "Actividad registrada",
            "actividad": {
              "id": 1,
              "accion": "login",
              "descripcion": "Inicio de sesión exitoso desde app móvil",
              "ip": "127.0.0.1",
              "dispositivo": "Samsung Galaxy S23 Android 14",
              "fecha": "13/04/2026 22:10"
            }
          }
        headers: []
        description: Registrado
      -
        custom: []
        status: 422
        content: |-
          {
            "message": "Error de validación",
            "errors": {"accion": ["The accion field is required."]}
          }
        headers: []
        description: Validación
    responseFields:
      id:
        custom: []
        name: id
        description: 'ID de la actividad registrada.'
        required: false
        example: null
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      accion:
        custom: []
        name: accion
        description: 'Acción registrada.'
        required: false
        example: null
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      descripcion:
        custom: []
        name: descripcion
        description: 'Descripción de la acción.'
        required: false
        example: null
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      ip:
        custom: []
        name: ip
        description: 'IP desde donde se realizó la acción.'
        required: false
        example: null
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      dispositivo:
        custom: []
        name: dispositivo
        description: 'Dispositivo desde donde se realizó la acción.'
        required: false
        example: null
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      fecha:
        custom: []
        name: fecha
        description: 'Fecha y hora formateada (d/m/Y H:i).'
        required: false
        example: null
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    auth:
      - headers
      - Authorization
      - 'Bearer 3V5EgbkvZcDPa166h8fd4ae'
    controller: null
    method: null
    route: null
